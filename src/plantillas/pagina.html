<!DOCTYPE html>
<html lang="{{IDIOMA}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRIPCION}}">
{{ALTERNAS}}
<link rel="stylesheet" href="{{BASE}}estilos/tokens.css?v={{V_TOKENS}}">
<link rel="stylesheet" href="{{BASE}}estilos/sitio.css?v={{V_ESTILOS}}">
{{COLORES}}
<script>
  // Tema antes de pintar, para que no haya destello. Si el almacenamiento falla,
  // se usa la preferencia del sistema y el sitio funciona igual.
  try {
    var t = localStorage.getItem('neuroteca-tema');
    if (t) { document.documentElement.setAttribute('data-tema', t); }
  } catch (e) {}
</script>
</head>
<body>

<a class="saltar" href="#contenido">{{T_SALTAR}}</a>

<header class="sitio">
  <a class="marca" href="{{INICIO}}">Neuroteca</a>
  <span class="bajada">{{T_BAJADA}}</span>
  <span class="acciones">
    {{NAV_SITIO}}
    <button class="tema-btn" id="btn-tema" type="button">{{T_TEMA}}</button>
  </span>
</header>

{{AVISO}}

{{CUERPO}}

<footer class="sitio">
  <strong>Neuroteca</strong> · {{PIE}}
</footer>

<script src="{{BASE}}js/sitio.js?v={{V_JS}}"></script>
{{GUION_VISOR}}
</body>
</html>
